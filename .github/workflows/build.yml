name: Build

on:
  push:
    branches:
      - master
      - main
      - develop
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - master
      - main
      - develop

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION_FILE: Spline.slnx
  PACKAGE_PROJECT: src/Spline.Core/Spline.Core.csproj
  PACKAGE_OUTPUT: artifacts/packages

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore $SOLUTION_FILE

      - name: Build
        run: dotnet build $SOLUTION_FILE -c Release --no-restore

      - name: Pack
        run: dotnet pack $PACKAGE_PROJECT -c Release --no-build -o $PACKAGE_OUTPUT

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 30
